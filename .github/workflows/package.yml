# Weekly (and on demand): build a runnable bundle per OS, prove it starts, upload it.
name: package

on:
  schedule:
    - cron: "17 3 * * 1"          # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m tools.package
      - uses: actions/upload-artifact@v4
        with:
          name: sql-witch-${{ matrix.os }}
          path: dist/
          retention-days: 14
