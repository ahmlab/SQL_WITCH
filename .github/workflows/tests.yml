# Every push and pull request: the whole test suite on Linux, macOS and Windows, headless.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python main.py --smoke-test
      # The pseudo-locale: accented, 35% longer text. The test suite plays a scripted battle in
      # it (tests/test_i18n.py); this proves the game also starts in it.
      - run: python main.py --smoke-test --locale qps
      - run: python tools/i18n_report.py
